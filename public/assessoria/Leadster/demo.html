<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo — Chat Form</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0f1720;color:#e9edef;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  .box{text-align:center;max-width:520px}
  h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin-bottom:14px}
  p{color:#8696a0;margin-bottom:28px;line-height:1.6}
  .btn{display:inline-block;padding:16px 34px;border:0;border-radius:999px;background:#25D366;
       color:#06251a;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
       transition:.15s;box-shadow:0 10px 30px rgba(37,211,102,.25)}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  small{display:block;margin-top:22px;color:#5c6b73;font-size:13px}
</style>
</head>
<body>

  <div class="box">
    <h1>Página de exemplo</h1>
    <p>Esta página só existe para testar o formulário. Os três botões abaixo abrem o
       mesmo chat, cada um por um gatilho diferente.</p>

    <!-- 1. atributo -->
    <button class="btn" data-chatform-open>Quero uma análise gratuita</button>

    <!-- 2. classe CSS (é a mais prática no Elementor/WordPress) -->
    <button class="btn chatform-open">Falar com um especialista</button>

    <!-- 3. link para #chatform -->
    <a class="btn" href="#chatform">Solicitar orçamento</a>

    <small>Use <code>data-chatform-open</code>, a classe <code>chatform-open</code>
           ou um link para <code>#chatform</code>.<br>
           Também dá pra abrir por código: <code>ChatForm.open()</code></small>
  </div>

  <!-- O WIDGET -->
  <script src="chat-form.js" defer></script>

</body>
</html>
